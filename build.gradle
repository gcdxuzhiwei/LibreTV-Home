buildscript {
    ext { kotlinVersion = '1.9.24' }
    repositories { google(); mavenCentral() }
    dependencies { classpath('com.facebook.react:react-native-gradle-plugin'); classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion") }
}
plugins { id 'com.android.application' version '8.7.3' apply false }
